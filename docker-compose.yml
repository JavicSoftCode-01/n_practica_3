version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: practica3_postgres_db
    restart: always
    environment:
      POSTGRES_DB: practican3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practican3"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: practica3_django_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: practican3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SECRET_KEY: django-insecure-docker-compose-secret-key-12345
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
